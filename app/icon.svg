  <!-- Subtly glowing amber border -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.9"/>
  <!-- Centered bold letter K in Amber -->
  <text x="16" y="22" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" fill="#f59e0b" text-anchor="middle">K</text>
</svg>
